<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apartment Walkthrough</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="viewer">
    <div id="stage">
      <img id="frame-a" class="frame" alt="" draggable="false" />
      <img id="frame-b" class="frame" alt="" draggable="false" />
      <div id="hotspots"></div>
    </div>

    <header id="topbar">
      <div class="titles">
        <h1 id="tour-title"></h1>
        <span id="room-name" class="room-chip"></span>
      </div>
      <div class="topbar-actions">
        <button id="btn-plan" class="btn" title="Floor plan (P)">Floor&nbsp;Plan</button>
        <button id="btn-fs" class="btn" title="Fullscreen (F)">⛶</button>
      </div>
    </header>

    <nav id="room-nav"></nav>

    <div id="minimap" title="Click to expand floor plan"></div>

    <div id="hint">Click the arrows to walk through &middot; ← → ↑ keys work too</div>

    <div id="plan-overlay" class="hidden">
      <div id="plan-card">
        <div id="plan-head">
          <h2>Floor Plan</h2>
          <div>
            <label class="toggle"><input type="checkbox" id="chk-dims" checked /> Dimensions</label>
            <button id="btn-close-plan" class="btn">✕</button>
          </div>
        </div>
        <div id="plan-svg-holder"></div>
        <p id="plan-note"></p>
      </div>
    </div>

    <div id="empty-state" class="hidden">
      <p>No tour data loaded yet.</p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/floorplan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
